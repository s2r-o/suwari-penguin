<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#dff3f4"><title>すわりぺん</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#173f51;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#173749;touch-action:none}#app{max-width:520px;height:100dvh;margin:auto;background:#e8f6f4;display:flex;flex-direction:column;position:relative;overflow:hidden}header,footer{background:#f8fcf7;z-index:3;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}header{height:76px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #b9d6d8}h1{font-size:16px;margin:0}small{color:#6b8990}.shots{font:700 20px ui-monospace}#field{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}footer{padding-top:10px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid #b9d6d8;display:flex;gap:8px}button{border:1px solid #bfd6d2;background:#eaf3ee;border-radius:8px;padding:12px 14px;color:#173749;font-weight:700;flex:1}.coral{background:#f6dfd5;border-color:#e7b7a4}#msg{position:absolute;top:14px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#fafff4e8;border:1px solid #b9d7d1;border-radius:6px;font-size:11px;white-space:nowrap;z-index:2}.screen{position:absolute;inset:0;z-index:10;background:#e5f4ed;display:grid;place-items:center;padding:24px}.card{text-align:center;width:min(340px,100%)}.card h2{font-size:42px;margin:8px}.card p{line-height:1.8;color:#648591;font-size:13px}.peng{font-size:76px;display:block;margin:14px}.screen button{width:100%;background:#f0957f;border-color:#ce7566;font-size:15px}.hide{display:none!important}
</style></head><body><main id="app"><header><div><small id="course">COURSE 01 / 06</small><h1 id="name">はじめての、すーっ。</h1></div><div class="shots"><span id="left">1</span><small> 打</small></div></header><section id="field"><canvas id="c"></canvas><div id="msg">ペンギンを指で払って、すーっ。</div></section><footer><button class="coral" id="retry">もう一度</button><button id="look">先を見る</button></footer><section id="title" class="screen"><div class="card"><small>A LITTLE PENGUIN. A LONG SLIDE.</small><h2>すわりぺん</h2><span class="peng">🐧</span><p>腹すべりができないペンギン。<br>座ったまま、なすがまま。<br><br>指で払った長さと速さが、そのまま滑りへ。<br>お魚まで届けよう。</p><button id="start">すべる</button></div></section><section id="result" class="screen hide"><div class="card"><span class="peng">🐧🐟</span><h2 id="rt">おさかな！</h2><p id="rp"></p><button id="next">つぎへ</button></div></section></main><script>
const cvs=document.querySelector('#c'),x=cvs.getContext('2d'),D=devicePixelRatio||1,field=document.querySelector('#field');
const levels=[
{name:'はじめての、すーっ。',h:1250,n:1,s:[180,1110],g:[180,170],walls:[]},
{name:'よけて、すーっ。',h:1450,n:1,s:[110,1320],g:[265,160],walls:[[30,700,210,36]]},
{name:'一回、曲がります。',h:1650,n:1,s:[85,1510],g:[275,210],walls:[[250,800,80,260]]},
{name:'次の一打のために。',h:1800,n:2,s:[180,1650],g:[270,170],walls:[[28,930,220,38],[120,520,212,38]]},
{name:'氷のジグザグ。',h:2050,n:2,s:[80,1900],g:[285,160],walls:[[180,1450,150,38],[28,980,160,38],[180,520,150,38]]},
{name:'ながい旅。',h:2400,n:2,s:[280,2240],g:[80,150],walls:[[28,1760,210,38],[155,1260,175,38],[28,760,190,38]]}
];
let W=360,H=700,sc=1,cam=0,li=0,shots=0,state='ready',p={x:0,y:0,vx:0,vy:0,a:0},drag=null,preview=false,last=performance.now(),spin=0;
function el(q){return document.querySelector(q)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resize(){W=field.clientWidth;H=field.clientHeight;cvs.width=W*D;cvs.height=H*D;x.setTransform(D,0,0,D,0,0);sc=W/360}addEventListener('resize',resize);
function L(){return levels[li]}function target(){return clamp(p.y-H/sc*.64,0,Math.max(0,L().h-H/sc))}
function load(i=li){li=i;shots=0;state='ready';preview=false;let l=L();p={x:l.s[0],y:l.s[1],vx:0,vy:0,a:0};cam=target();el('#course').textContent='COURSE '+String(li+1).padStart(2,'0')+' / 06';el('#name').textContent=l.name;hud();msg('ペンギンを指で払って、すーっ。')}
function hud(){el('#left').textContent=Math.max(0,L().n-shots)}
function msg(t){el('#msg').textContent=t}
function world(e){let r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc+cam}}
function near(q){return Math.hypot(q.x-p.x,q.y-p.y)<52}
cvs.addEventListener('pointerdown',e=>{cvs.setPointerCapture(e.pointerId);let q=world(e);drag={id:e.pointerId,start:q,last:q,t:performance.now(),samples:[{q,t:performance.now()}],mode:state==='ready'&&near(q)?'shot':'pan',cy:cam};});
cvs.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let q=world(e);if(drag.mode==='pan'){let dy=(e.clientY-(drag.sy??e.clientY))/sc;if(drag.sy==null)drag.sy=e.clientY;cam=clamp(drag.cy-dy,0,Math.max(0,L().h-H/sc));preview=true}else{drag.last=q;let now=performance.now();drag.samples.push({q,t:now});while(drag.samples.length>8||now-drag.samples[0].t>110)drag.samples.shift()}});
function up(e){if(!drag||drag.id!==e.pointerId)return;if(drag.mode==='shot'&&state==='ready'){let q=world(e),dx=q.x-drag.start.x,dy=q.y-drag.start.y,d=Math.hypot(dx,dy);let now=performance.now(),a=drag.samples.find(v=>now-v.t<=90)||drag.samples[0],vx=(q.x-a.q.x)/Math.max(.018,(now-a.t)/1000),vy=(q.y-a.q.y)/Math.max(.018,(now-a.t)/1000),speed=Math.hypot(vx,vy);if(d>14&&speed>80){let ux=vx/speed,uy=vy/speed;let launch=clamp(0.62*speed+1.15*d,90,1250);p.vx=ux*launch;p.vy=uy*launch;shots++;hud();state='slide';preview=false;msg('すーっ……');}}drag=null}
cvs.addEventListener('pointerup',up);cvs.addEventListener('pointercancel',()=>drag=null);
function hitWall(w){let r=15,nx=clamp(p.x,w[0],w[0]+w[2]),ny=clamp(p.y,w[1],w[1]+w[3]),dx=p.x-nx,dy=p.y-ny;if(dx*dx+dy*dy>=r*r)return false;let len=Math.hypot(dx,dy)||1,nxx=dx/len,nyy=dy/len;if(!dx&&!dy){let ds=[p.x-w[0],w[0]+w[2]-p.x,p.y-w[1],w[1]+w[3]-p.y],m=Math.min(...ds),k=ds.indexOf(m);nxx=k===0?-1:k===1?1:0;nyy=k===2?-1:k===3?1:0}let dot=p.vx*nxx+p.vy*nyy;if(dot<0){p.vx-=1.96*dot*nxx;p.vy-=1.96*dot*nyy;spin+=Math.min(10,Math.hypot(p.vx,p.vy)/80)}p.x=nx+nxx*(r+.8);p.y=ny+nyy*(r+.8);return true}
function step(dt){if(state!=='slide')return;p.x+=p.vx*dt;p.y+=p.vy*dt;let damp=Math.exp(-.045*dt);p.vx*=damp;p.vy*=damp;if(p.x<42){p.x=42;p.vx=Math.abs(p.vx)*.97;spin+=4}if(p.x>318){p.x=318;p.vx=-Math.abs(p.vx)*.97;spin+=4}if(p.y<42){p.y=42;p.vy=Math.abs(p.vy)*.97;spin+=4}if(p.y>L().h-42){p.y=L().h-42;p.vy=-Math.abs(p.vy)*.97;spin+=4}L().walls.forEach(hitWall);let speed=Math.hypot(p.vx,p.vy);p.a+=spin*dt;spin*=Math.exp(-2.1*dt);if(Math.hypot(p.x-L().g[0],p.y-L().g[1])<31){state='win';setTimeout(win,350);return}if(speed<12){p.vx=p.vy=0;if(shots>=L().n){state='lose';setTimeout(lose,250)}else{state='ready';msg('次の一打。先を見てから、スッ。')}}if(!preview)cam+=(target()-cam)*(1-Math.exp(-7*dt))}
function rect(a,b,c,d,col){x.fillStyle=col;x.fillRect(a,b,c,d)}function txt(t,a,b,s=10,col='#648591'){x.fillStyle=col;x.font='600 '+s+'px -apple-system';x.textAlign='center';x.fillText(t,a,b)}
function penguin(a,b,ang){x.save();x.translate(a,b);x.rotate(ang);rect(-15,-10,30,24,'#193a49');rect(-11,-7,22,19,'#f8f4df');rect(-13,-17,26,15,'#193a49');rect(-7,-13,4,4,'#f7faf0');rect(4,-13,4,4,'#f7faf0');rect(-5,-12,2,2,'#17313c');rect(6,-12,2,2,'#17313c');rect(-3,-8,7,4,'#ed9a6e');rect(-20,-3,6,13,'#193a49');rect(14,-3,6,13,'#193a49');rect(-12,13,10,4,'#ed9a6e');rect(3,13,10,4,'#ed9a6e');x.restore()}
function fish(a,b){rect(a-10,b-5,18,10,'#ef9b7b');rect(a+8,b-7,8,14,'#ef9b7b');rect(a-5,b-2,2,2,'#fff')}
function draw(){x.setTransform(D,0,0,D,0,0);rect(0,0,W,H,'#b7dce3');x.save();x.scale(sc,sc);x.translate(0,-cam);let l=L();rect(20,0,320,l.h,'#dff1ee');rect(26,0,308,l.h,'#edf8f3');for(let y=30;y<l.h;y+=80){rect(45+(y*13%240),y,10,2,'#c9e2de')}for(let y=0;y<l.h;y+=28){rect(20,y,7,24,'#f8fcf4');rect(333,y,7,24,'#f8fcf4')}l.walls.forEach(w=>{rect(w[0],w[1],w[2],w[3],'#86b5c1');rect(w[0]+3,w[1]+3,w[2]-6,6,'#e9f4ee')});fish(l.g[0],l.g[1]);txt('おさかな',l.g[0],l.g[1]-22,9);x.strokeStyle='#9cbfbd';x.setLineDash([3,4]);x.beginPath();x.ellipse(l.s[0],l.s[1],27,9,0,0,Math.PI*2);x.stroke();x.setLineDash([]);penguin(p.x,p.y,p.a);x.restore()}
function win(){el('#rt').textContent='おさかな！';el('#rp').textContent=(shots===1?'一打で届いた。':'届いた。')+' 座ったまま、ちゃんと。';el('#next').textContent=li===levels.length-1?'最初から':'つぎへ';el('#result').classList.remove('hide')}
function lose(){el('#rt').textContent='あと、ちょっと。';el('#rp').textContent=L().n+'打では届かなかった。角度と勢いを変えてみよう。';el('#next').textContent='もう一度';el('#result').classList.remove('hide')}
el('#start').onclick=()=>el('#title').classList.add('hide');el('#retry').onclick=()=>load();el('#look').onclick=()=>{preview=!preview;if(preview){cam=0;msg('コースの先を確認中。背景をなぞって見渡せる。')}else{cam=target();msg('ペンギンへ戻った。')}};el('#next').onclick=()=>{el('#result').classList.add('hide');if(state==='win')load(li===levels.length-1?0:li+1);else load()};
function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}resize();load(0);requestAnimationFrame(loop);
</script></body></html>
